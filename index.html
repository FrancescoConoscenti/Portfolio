<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Francesco Conoscenti — Portfolio</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Arial', '"Helvetica Neue"', 'Helvetica', 'sans-serif'],
            mono: ['"SF Mono"', 'Menlo', 'Monaco', 'Courier New', 'monospace']
          },
          colors: { canvas: '#FBFBFA', charcoal: '#111111', muted: '#767676', borderline: '#E5E5E3' }
        }
      }
    }
  </script>

  <!-- PDF.js: renders the single-page PDFs in the browser -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <style>
    body {
      background-color: #FBFBFA;
      color: #111111;
      font-family: Arial, "Helvetica Neue", Helvetica, sans-serif;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }

    .book-thumb-img { transition: opacity 0.3s ease; }
    .book-card:hover .book-thumb-img { opacity: 0.8; }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* About drawer */
    .drawer-content { transform: translateX(100%); transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
    .drawer-active .drawer-content { transform: translateX(0); }

    /* Book viewer overlay */
    .viewer { transition: opacity 0.3s ease, visibility 0.3s ease; }
    .viewer.hidden-view { opacity: 0; visibility: hidden; pointer-events: none; }
    .viewer.visible-view { opacity: 1; visibility: visible; pointer-events: auto; }

    #pageStage canvas, #pageStage img {
      max-width: 100%;
      max-height: 100%;
      box-shadow: 0 1px 14px rgba(0,0,0,0.10);
      background: #fff;
      user-select: none;
      -webkit-user-drag: none;
    }
    .nav-arrow { transition: opacity 0.2s ease, transform 0.2s ease; }
    .nav-arrow:disabled { opacity: 0.15; cursor: default; }
  </style>
</head>
<body class="selection:bg-black selection:text-white flex flex-col min-h-screen">

  <!-- Header: name on the left, Information on the right -->
  <header class="px-6 sm:px-12 lg:px-16 pt-8 pb-4 flex items-baseline justify-between">
    <a href="#" onclick="closeBook(); return false;" class="text-sm font-bold uppercase tracking-tight hover:opacity-70 transition-opacity">Francesco Conoscenti</a>
    <button onclick="toggleAbout(true)" class="text-xs uppercase tracking-wider text-muted hover:text-charcoal transition-colors">Information</button>
  </header>

  <!-- Index: covers only -->
  <main class="flex-grow max-w-[1720px] mx-auto w-full px-6 sm:px-12 lg:px-16 pt-10 pb-20">
    <div id="booksGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-x-8 sm:gap-x-10 lg:gap-x-12 gap-y-12 sm:gap-y-16 items-end"></div>
    <p id="statusMsg" class="hidden text-xs text-muted leading-relaxed max-w-xl"></p>
  </main>

  <!-- Book viewer: the page takes all the space; arrows / keys / swipe to move, Esc or ✕ to close -->
  <div id="bookViewer" class="viewer hidden-view fixed inset-0 z-40 bg-[#FBFBFA]">
    <button onclick="closeBook()" class="absolute top-3 right-4 z-20 w-10 h-10 flex items-center justify-center text-xl text-charcoal hover:opacity-60 transition-opacity" aria-label="Close">✕</button>

    <button id="prevBtn" onclick="goPage(-1)" class="nav-arrow absolute left-0 sm:left-2 top-1/2 -translate-y-1/2 z-10 p-3 text-charcoal" aria-label="Previous page">
      <svg class="w-7 h-7 stroke-current" fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 19l-7-7 7-7"/></svg>
    </button>

    <div id="pageStage" class="absolute inset-0 flex items-center justify-center p-3 sm:p-4"></div>

    <button id="nextBtn" onclick="goPage(1)" class="nav-arrow absolute right-0 sm:right-2 top-1/2 -translate-y-1/2 z-10 p-3 text-charcoal" aria-label="Next page">
      <svg class="w-7 h-7 stroke-current" fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 5l7 7-7 7"/></svg>
    </button>
  </div>

  <!-- Information drawer -->
  <div id="aboutDrawer" class="fixed inset-0 z-50 pointer-events-none transition-all duration-300">
    <div id="aboutBackdrop" onclick="toggleAbout(false)" class="absolute inset-0 bg-black/30 opacity-0 transition-opacity duration-300 pointer-events-none"></div>

    <div class="drawer-content absolute right-0 top-0 bottom-0 w-full sm:w-[440px] bg-[#FBFBFA] p-8 sm:p-12 overflow-y-auto no-scrollbar pointer-events-auto">
      <div class="flex justify-end">
        <button onclick="toggleAbout(false)" class="text-xs uppercase tracking-wider text-muted hover:text-charcoal transition-colors">Close ✕</button>
      </div>

      <p class="mt-10 text-sm text-charcoal leading-relaxed">
        Francesco is a physicist with the passion of photography based in Berlin. Contact him to buy a printed photo or album or find him in the Fleamarkt around the city.
      </p>

      <div class="mt-8 space-y-1 text-sm">
        <p><a href="https://www.instagram.com/francesco_conoscenti" target="_blank" rel="noopener" class="underline underline-offset-2 hover:opacity-60">@francesco_conoscenti</a></p>
        <p><a href="mailto:francy.cono@gmail.com" class="underline underline-offset-2 hover:opacity-60">francy.cono@gmail.com</a></p>
      </div>
    </div>
  </div>

  <script>
    /* ------------------------------------------------------------------
       YOUR BOOKS — the only part you ever edit.

       images/Cover/<cover>                 the cover (PDF or image)
       images/Pages/<id>/<prefix><n>.pdf    the pages, n = start, start+1, ...

       The page looks for page files one after the other and stops at the
       first number that doesn't exist, so just drop new pages into the
       folder (numbered without gaps) — nothing else to update.

       To add a book: copy one line, change id / cover / prefix.
       ------------------------------------------------------------------ */
    const BOOKS = [
      { id: 'book23', title: 'Book 23', cover: 'book23-1.pdf',                prefix: 'book23-',                 start: 2 },
      { id: 'book24', title: 'Book 24', cover: 'book24-1.pdf',                prefix: 'book24-',                 start: 2 },
      { id: 'bookAL', title: 'America Latina', cover: 'bookAmericaLatina-pages-1.pdf', prefix: 'bookAmericaLatina-pages-', start: 2 },
    ];

    const COVER_DIR = 'images/Cover/';
    const PAGES_DIR = 'images/Pages/';
    const MAX_PAGES = 500;   // safety limit

    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    let books = [];          // { id, title, coverUrl, pages: [url] }
    let currentBook = null;
    let currentPage = 0;
    let renderToken = 0;
    const pdfCache = new Map();   // url -> Promise<PDFDocumentProxy>

    /* ---------- discovery ---------- */

    // true if the file exists (and the server didn't answer with an HTML fallback page)
    async function exists(url) {
      const ok = res => res.ok && !/text\/html/i.test(res.headers.get('content-type') || '');
      try {
        const head = await fetch(url, { method: 'HEAD' });
        if (ok(head)) return true;
        if (head.status === 404) return false;
      } catch (e) {}
      try {   // some hosts refuse HEAD: ask for the first byte instead
        const res = await fetch(url, { headers: { Range: 'bytes=0-0' } });
        return ok(res);
      } catch (e) { return false; }
    }

    async function discoverPages(book) {
      const dir = PAGES_DIR + encodeURIComponent(book.id) + '/';
      const pages = [];
      book.firstTried = dir + encodeURIComponent(book.prefix + (book.start ?? 1) + '.pdf');
      for (let n = book.start ?? 1; pages.length < MAX_PAGES; n++) {
        const url = dir + encodeURIComponent(book.prefix + n + '.pdf');
        if (!(await exists(url))) break;
        pages.push(url);
      }
      return pages;
    }

    async function discover() {
      return Promise.all(BOOKS.map(async b => ({
        id: b.id,
        title: b.title || b.id,
        coverUrl: b.cover ? COVER_DIR + encodeURIComponent(b.cover) : null,
        pages: await discoverPages(b),
        firstTried: b.firstTried,
        coverTried: b.cover ? COVER_DIR + encodeURIComponent(b.cover) : null
      })));
    }

    /* ---------- PDF helpers ---------- */

    function getPdf(url) {
      if (!pdfCache.has(url)) {
        pdfCache.set(url, pdfjsLib.getDocument(url).promise.catch(err => { pdfCache.delete(url); throw err; }));
      }
      return pdfCache.get(url);
    }

    async function renderPdfToCanvas(url, maxW, maxH) {
      const pdf = await getPdf(url);
      const page = await pdf.getPage(1);
      const base = page.getViewport({ scale: 1 });
      const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
      const fit = Math.min(maxW / base.width, maxH / base.height);
      const viewport = page.getViewport({ scale: fit * dpr });
      const canvas = document.createElement('canvas');
      canvas.width = Math.floor(viewport.width);
      canvas.height = Math.floor(viewport.height);
      canvas.style.width = Math.floor(viewport.width / dpr) + 'px';
      canvas.style.height = Math.floor(viewport.height / dpr) + 'px';
      await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
      return canvas;
    }

    /* ---------- index grid ---------- */

    async function renderIndex() {
      const grid = document.getElementById('booksGrid');
      grid.innerHTML = '';
      books = await discover();
      books = books.filter(b => b.pages.length || b.coverUrl);

      if (!books.length) {
        const msg = document.getElementById('statusMsg');
        msg.classList.remove('hidden');
        msg.textContent = 'No books found. Check that the images folder is next to index.html and that the names in the BOOKS list match your files. The page must be opened through a web server (a hosting service, or a local one such as VS Code Live Server), not by double-clicking the file.';
        return;
      }

      const missing = books.filter(b => !b.pages.length);
      if (missing.length) {
        const msg = document.getElementById('statusMsg');
        msg.classList.remove('hidden');
        msg.classList.add('mt-12');
        msg.innerHTML = '<b>Some pages were not found.</b> The page looked for these files and the server did not return them:<br>' +
          missing.map(b => '<code>' + new URL(b.firstTried, location.href).href + '</code>').join('<br>') +
          '<br>Open one of these addresses in your browser: if it says "404", the file is not at that path in your repository (check folder names, capital letters and the file name).';
      }

      books.forEach((book, index) => {
        const card = document.createElement('article');
        card.className = 'book-card group cursor-pointer flex flex-col';
        card.onclick = () => openBook(index);

        const frame = document.createElement('div');
        frame.className = 'w-full flex items-end justify-center';
        card.appendChild(frame);

        if (book.coverUrl && /\.pdf$/i.test(book.coverUrl)) {
          renderPdfToCanvas(book.coverUrl, 500, 650).then(c => {
            c.className = 'book-thumb-img';
            c.style.width = '100%'; c.style.height = 'auto';
            frame.appendChild(c);
          }).catch(() => frame.appendChild(placeholder(book.title)));
        } else if (book.coverUrl) {
          const img = document.createElement('img');
          img.src = book.coverUrl;
          img.alt = book.title;
          img.loading = 'lazy';
          img.className = 'book-thumb-img w-full h-auto block';
          img.onerror = () => { img.replaceWith(placeholder(book.title)); };
          frame.appendChild(img);
        } else {
          frame.appendChild(placeholder(book.title));
        }

        grid.appendChild(card);
      });
    }

    function placeholder(title) {
      const d = document.createElement('div');
      d.className = 'w-full aspect-[3/4] bg-[#f1f1ee] border border-[#E5E5E3] flex items-center justify-center text-[11px] text-muted';
      d.textContent = title;
      return d;
    }

    /* ---------- viewer ---------- */

    function openBook(index) {
      currentBook = books[index];
      if (!currentBook || !currentBook.pages.length) return;
      currentPage = 0;
      const v = document.getElementById('bookViewer');
      v.classList.remove('hidden-view');
      v.classList.add('visible-view');
      document.body.style.overflow = 'hidden';
      showPage();
    }

    function closeBook() {
      const v = document.getElementById('bookViewer');
      v.classList.remove('visible-view');
      v.classList.add('hidden-view');
      document.body.style.overflow = 'auto';
      currentBook = null;
      renderToken++;
    }

    function goPage(dir) {
      if (!currentBook) return;
      const next = currentPage + dir;
      if (next < 0 || next >= currentBook.pages.length) return;
      currentPage = next;
      showPage();
    }

    async function showPage() {
      const token = ++renderToken;
      const stage = document.getElementById('pageStage');
      const total = currentBook.pages.length;
      document.getElementById('prevBtn').disabled = currentPage === 0;
      document.getElementById('nextBtn').disabled = currentPage === total - 1;

      const style = getComputedStyle(stage);
      const w = stage.clientWidth - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight);
      const h = stage.clientHeight - parseFloat(style.paddingTop) - parseFloat(style.paddingBottom);

      try {
        const canvas = await renderPdfToCanvas(currentBook.pages[currentPage], w, h);
        if (token !== renderToken) return;
        stage.innerHTML = '';
        stage.appendChild(canvas);
      } catch (e) {
        if (token !== renderToken) return;
        stage.innerHTML = '<p class="text-xs text-muted">Could not load this page.</p>';
      }

      // warm the cache for neighbouring pages
      [currentPage + 1, currentPage - 1].forEach(i => {
        if (currentBook && currentBook.pages[i]) getPdf(currentBook.pages[i]).catch(() => {});
      });
    }

    // Click left/right half of the page to move; swipe on touch screens
    document.getElementById('pageStage').addEventListener('click', e => {
      if (e.target.closest('canvas') || e.target.id === 'pageStage') {
        const rect = e.currentTarget.getBoundingClientRect();
        goPage(e.clientX < rect.left + rect.width / 2 ? -1 : 1);
      }
    });
    let touchX = null;
    document.getElementById('bookViewer').addEventListener('touchstart', e => { touchX = e.changedTouches[0].clientX; }, { passive: true });
    document.getElementById('bookViewer').addEventListener('touchend', e => {
      if (touchX === null) return;
      const dx = e.changedTouches[0].clientX - touchX;
      if (Math.abs(dx) > 50) goPage(dx < 0 ? 1 : -1);
      touchX = null;
    }, { passive: true });

    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => { if (currentBook) showPage(); }, 200);
    });

    window.addEventListener('keydown', e => {
      if (!currentBook) return;
      if (e.key === 'ArrowRight') goPage(1);
      else if (e.key === 'ArrowLeft') goPage(-1);
      else if (e.key === 'Home') { currentPage = 0; showPage(); }
      else if (e.key === 'End') { currentPage = currentBook.pages.length - 1; showPage(); }
      else if (e.key === 'Escape') closeBook();
    });

    /* ---------- drawer / menu ---------- */

    function toggleAbout(open) {
      const drawer = document.getElementById('aboutDrawer');
      const backdrop = document.getElementById('aboutBackdrop');
      if (open) {
        drawer.classList.add('drawer-active');
        backdrop.classList.remove('pointer-events-none', 'opacity-0');
        backdrop.classList.add('pointer-events-auto', 'opacity-100');
        document.body.style.overflow = 'hidden';
      } else {
        drawer.classList.remove('drawer-active');
        backdrop.classList.remove('pointer-events-auto', 'opacity-100');
        backdrop.classList.add('pointer-events-none', 'opacity-0');
        if (!currentBook) document.body.style.overflow = 'auto';
      }
    }

    window.addEventListener('DOMContentLoaded', renderIndex);
  </script>
</body>
</html>
